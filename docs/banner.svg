<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 900 420" width="900" height="420" role="img" aria-labelledby="t">
<title id="t">Student Management System sorting benchmark</title>
<style>
.up{transform-box:fill-box;transform-origin:50% 100%;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite both}
.in{animation:in 7s ease infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 7s cubic-bezier(.3,1.4,.5,1) infinite both}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 9;animation:flow 1s linear infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.breathe{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6s ease-in-out infinite alternate}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{0%{transform:scaleY(0)}20%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes grow{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}10%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{to{stroke-dashoffset:-34}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes breathe{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes sheen{0%{transform:translateX(0)}30%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00c896" stop-opacity=".3"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>

<clipPath id="round"><rect x="0" y="90" width="900" height="420" rx="22"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="900" height="600" fill="url(#bg)"/>
<rect width="900" height="600" fill="url(#dots)"/>
<circle class="breathe" cx="670" cy="300" r="290" fill="url(#glow)"/>
<g transform="translate(-40 0)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
<text x="500" y="168" fill="#96afc8" font-weight="700">Comparisons at 10,000 records</text>
<text x="500" y="212" fill="#e2eeff">Bubble</text><rect x="600" y="196" width="230" height="22" rx="5" fill="#13243a"/><rect class="grow" x="600" y="196" width="230" height="22" rx="5" fill="#d95926" style="animation-delay:0.30s"/><text class="in" x="838" y="212" fill="#96afc8" style="animation-delay:1.20s">50M</text><text x="500" y="256" fill="#e2eeff">Selection</text><rect x="600" y="240" width="230" height="22" rx="5" fill="#13243a"/><rect class="grow" x="600" y="240" width="230" height="22" rx="5" fill="#d95926" style="animation-delay:0.48s"/><text class="in" x="838" y="256" fill="#96afc8" style="animation-delay:1.38s">50M</text><text x="500" y="300" fill="#e2eeff">Insertion</text><rect x="600" y="284" width="230" height="22" rx="5" fill="#13243a"/><rect class="grow" x="600" y="284" width="116" height="22" rx="5" fill="#c98500" style="animation-delay:0.66s"/><text class="in" x="724" y="300" fill="#96afc8" style="animation-delay:1.56s">25M</text><text x="500" y="344" fill="#e2eeff">Quick</text><rect x="600" y="328" width="230" height="22" rx="5" fill="#13243a"/><rect class="grow" x="600" y="328" width="5" height="22" rx="2" fill="#2fffc0" style="animation-delay:0.84s"/><text class="in" x="613" y="344" fill="#96afc8" style="animation-delay:1.74s">0.23M</text><text x="500" y="388" fill="#e2eeff">Merge</text><rect x="600" y="372" width="230" height="22" rx="5" fill="#13243a"/><rect class="grow" x="600" y="372" width="4" height="22" rx="2" fill="#2fffc0" style="animation-delay:1.02s"/><text class="in" x="612" y="388" fill="#96afc8" style="animation-delay:1.92s">0.12M</text>
<g class="pop" style="animation-delay:2.40s"><rect x="672" y="410" width="158" height="32" rx="16" fill="#0a1e30" stroke="#2fffc0"/>
<text x="751" y="431" text-anchor="middle" fill="#2fffc0" font-weight="700">Merge sort wins</text></g>
</g>
<g transform="translate(0 46)">
<text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">C++ · ALGORITHMS</text>
<rect class="caret" x="301" y="135" width="10" height="18" fill="#2fffc0"/>
<text x="68" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Student</text>
<text x="68" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">Management</text>
<text x="70" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">5 sorting algorithms, measured</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700"><rect x="70" y="368" width="56" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="98" y="390" text-anchor="middle" fill="#e2eeff">C++</text><rect x="138" y="368" width="90" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="183" y="390" text-anchor="middle" fill="#e2eeff">Sorting</text><rect x="240" y="368" width="99" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="289.5" y="390" text-anchor="middle" fill="#e2eeff">AVL tree</text></g>
</g>
<g transform="skewX(-18)"><rect class="sheen" x="-420" y="0" width="220" height="600" fill="url(#sh)"/></g>
<g transform="translate(70 468)">
<rect width="266" height="30" rx="15" fill="#00c896" fill-opacity=".14" stroke="#00c896" stroke-opacity=".7"/>
<circle class="ring" cx="18" cy="15" r="5" fill="none" stroke="#2fffc0" stroke-width="2"/>
<circle cx="18" cy="15" r="4.5" fill="#2fffc0"/>
<text x="34" y="20" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2eeff">Open the finished version ↗</text>
</g>
</g>
</svg>
